version: 2

sources:
  - name: bronze
    schema: bronze
    description: >
      Ruwe brondata zoals ingelezen door dlt vanuit de SyncFeed 2.0 XML-feed van
      de Tweede Kamer Open Data API. Elke tabel bevat één rij per keer dat de bron
      een entiteit heeft aangemaakt of gewijzigd; er is nog geen deduplicatie of
      opschoning toegepast.
    tables:
      - name: activiteit
        description: Ruwe feed-rijen voor de entiteitsoort Activiteit.
      - name: activiteit__vervangen_vanuit
        description: >
          Dlt-childrijen voor de Activiteit-relatie VervangenVanuit.
      - name: activiteit__voortgezet_vanuit
        description: >
          Dlt-childrijen voor de Activiteit-relatie VoortgezetVanuit.
      - name: activiteit_actor
        description: >
          Ruwe feed-rijen voor de entiteitsoort ActiviteitActor, met optionele
          verwijzingen naar Activiteit, Commissie, Persoon en Fractie.
      - name: agendapunt
        description: >
          Ruwe feed-rijen voor de entiteitsoort Agendapunt, met de verwijzing naar
          de bijbehorende Activiteit.
      - name: besluit
        description: Ruwe feed-rijen voor de entiteitsoort Besluit.
      - name: besluit__zaak
        description: Dlt-childrijen voor de herhaalbare Besluit-Zaak-relatie.
      - name: besluit__atom_links
        description: Door dlt afgesplitste Atom-links van Besluiten.
      - name: stemming
        description: Ruwe feed-rijen voor de entiteitsoort Stemming.
      - name: stemming__atom_links
        description: Door dlt afgesplitste Atom-links van Stemmingen.
      - name: kamerstukdossier
        description: Ruwe feed-rijen voor de entiteitsoort Kamerstukdossier.
      - name: zaak
        description: Ruwe feed-rijen voor de entiteitsoort Zaak.
      - name: zaak__activiteit
        description: Dlt-childrijen voor de Zaak-Activiteit-relatie.
      - name: zaak__agendapunt
        description: Dlt-childrijen voor de Zaak-Agendapunt-relatie.
      - name: zaak__gerelateerd_vanuit
        description: Dlt-childrijen voor de Zaak-GerelateerdVanuit-relatie.
      - name: zaak__vervangen_vanuit
        description: Dlt-childrijen voor de Zaak-VervangenVanuit-relatie.
      - name: zaak_actor
        description: >
          Ruwe feed-rijen voor de entiteitsoort ZaakActor, met optionele
          verwijzingen naar Zaak, Persoon, Fractie en Commissie.
      - name: document
        description: Ruwe feed-rijen voor de entiteitsoort Document.
      - name: document__bron_document
        description: Dlt-childrijen voor de Document-BronDocument-relatie.
      - name: document__zaak
        description: Dlt-childrijen voor de Document-Zaak-relatie.
      - name: document__activiteit
        description: Dlt-childrijen voor de Document-Activiteit-relatie.
      - name: document__agendapunt
        description: Dlt-childrijen voor de Document-Agendapunt-relatie.
      - name: document__atom_links
        description: Door dlt afgesplitste Atom-links van Documenten.
      - name: document_versie
        description: Ruwe feed-rijen voor de entiteitsoort DocumentVersie.
      - name: document_versie__atom_links
        description: Door dlt afgesplitste Atom-links van DocumentVersies.
      - name: document_publicatie
        description: Ruwe feed-rijen voor de entiteitsoort DocumentPublicatie.
      - name: document_publicatie__atom_links
        description: Door dlt afgesplitste Atom-links van DocumentPublicaties.
      - name: document_publicatie_metadata
        description: Ruwe feed-rijen voor de entiteitsoort DocumentPublicatieMetadata.
      - name: document_publicatie_metadata__atom_links
        description: Door dlt afgesplitste Atom-links van publicatiemetadata.
      - name: document_actor
        description: Ruwe feed-rijen voor de entiteitsoort DocumentActor.
      - name: toezegging
        description: Ruwe feed-rijen voor de entiteitsoort Toezegging.
      - name: toezegging__atom_links
        description: Door dlt afgesplitste Atom-pagineringlinks van Toezeggingen.
      - name: toezegging__is_aanvulling_op
        description: Dlt-childrijen voor de Toezegging-IsAanvullingOp-relatie.
      - name: toezegging__is_herhaling_van
        description: Dlt-childrijen voor de Toezegging-IsHerhalingVan-relatie.
      - name: toezegging__is_wijziging_van
        description: Dlt-childrijen voor de Toezegging-IsWijzigingVan-relatie.
      - name: toezegging__kamerbrief_nakoming
        description: Dlt-childrijen voor Kamerbrieven die een Toezegging nakomen.
      - name: toezegging__toegezegd_aan
        description: Dlt-childrijen met personen en fracties aan wie is toegezegd.
      - name: persoon
        description: >
          Ruwe feed-rijen voor de entiteitsoort Persoon (een persoon als actor
          binnen het parlementaire proces).
      - name: persoon__atom_links
        description: >
          Door dlt automatisch afgesplitste Atom-links per Persoon-feedrij, o.a.
          'enclosure' (downloadlink van de portretfoto) en 'next' (paginering van
          de feed).
      - name: persoon_contactinformatie
        description: >
          Ruwe feed-rijen voor de entiteitsoort PersoonContactinformatie, met de
          verwijzing naar de bijbehorende Persoon.
      - name: persoon_geschenk
        description: >
          Ruwe feed-rijen voor de entiteitsoort PersoonGeschenk, met de verwijzing
          naar de bijbehorende Persoon.
      - name: persoon_loopbaan
        description: >
          Ruwe feed-rijen voor de entiteitsoort PersoonLoopbaan, met de verwijzing
          naar de bijbehorende Persoon.
      - name: persoon_nevenfunctie
        description: >
          Ruwe feed-rijen voor de entiteitsoort PersoonNevenfunctie, met de
          verwijzing naar de bijbehorende Persoon.
      - name: persoon_nevenfunctie_inkomsten
        description: >
          Ruwe feed-rijen voor de entiteitsoort PersoonNevenfunctieInkomsten, met
          de verwijzing naar de bijbehorende PersoonNevenfunctie.
      - name: persoon_onderwijs
        description: >
          Ruwe feed-rijen voor de entiteitsoort PersoonOnderwijs, met de verwijzing
          naar de bijbehorende Persoon.
      - name: persoon_reis
        description: >
          Ruwe feed-rijen voor de entiteitsoort PersoonReis, met de verwijzing naar
          de bijbehorende Persoon.
      - name: fractie
        description: Ruwe feed-rijen voor de entiteitsoort Fractie.
      - name: fractie__atom_links
        description: >
          Door dlt automatisch afgesplitste Atom-links per Fractie-feedrij, met
          onder andere de 'enclosure'-link naar een fractielogo.
      - name: fractie_zetel
        description: >
          Ruwe feed-rijen voor de entiteitsoort FractieZetel, met de verwijzing
          naar de bijbehorende Fractie.
      - name: fractie_zetel_persoon
        description: >
          Ruwe feed-rijen voor de entiteitsoort FractieZetelPersoon, met de
          verwijzingen naar de bijbehorende FractieZetel en Persoon.
      - name: fractie_zetel_vacature
        description: >
          Ruwe feed-rijen voor de entiteitsoort FractieZetelVacature, met de
          verwijzing naar de bijbehorende FractieZetel.
      - name: commissie
        description: Ruwe feed-rijen voor de entiteitsoort Commissie.
      - name: commissie_contactinformatie
        description: >
          Ruwe feed-rijen voor de entiteitsoort CommissieContactinformatie, met
          de verwijzing naar de bijbehorende Commissie.
      - name: commissie_zetel
        description: >
          Ruwe feed-rijen voor de entiteitsoort CommissieZetel, met de verwijzing
          naar de bijbehorende Commissie.
      - name: commissie_zetel_vast_persoon
        description: >
          Ruwe feed-rijen voor de entiteitsoort CommissieZetelVastPersoon, met de
          verwijzingen naar de bijbehorende CommissieZetel en Persoon.
      - name: commissie_zetel_vast_vacature
        description: >
          Ruwe feed-rijen voor de entiteitsoort CommissieZetelVastVacature, met de
          verwijzingen naar de bijbehorende CommissieZetel en Fractie.
      - name: commissie_zetel_vervanger_persoon
        description: >
          Ruwe feed-rijen voor de entiteitsoort CommissieZetelVervangerPersoon, met
          de verwijzingen naar de bijbehorende CommissieZetel en Persoon.
      - name: commissie_zetel_vervanger_vacature
        description: >
          Ruwe feed-rijen voor de entiteitsoort CommissieZetelVervangerVacature, met
          de verwijzingen naar de bijbehorende CommissieZetel en Fractie.
      - name: vergadering
        description: Ruwe feed-rijen voor de entiteitsoort Vergadering.
      - name: verslag
        description: >
          Ruwe feed-rijen voor de entiteitsoort Verslag, met de verwijzing naar
          de bijbehorende Vergadering.
      - name: verslag__atom_links
        description: >
          Door dlt automatisch afgesplitste Atom-links per Verslag-feedrij, met
          de 'enclosure'-link naar het XML-bestand van het verslag.
      - name: reservering
        description: Ruwe feed-rijen voor de entiteitsoort Reservering.
      - name: reservering__activiteit
        description: >
          Dlt-childrijen voor de Activiteit-relatie van een Reservering.
      - name: zaal
        description: Ruwe feed-rijen voor de entiteitsoort Zaal.
