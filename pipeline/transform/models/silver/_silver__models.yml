version: 2

models:
  - name: zaak
    description: Actuele, ontdubbelde zaken binnen het parlementaire proces.
    constraints:
      - type: primary_key
        columns: [id]
      - type: foreign_key
        columns: [kamerstukdossier_id]
        expression: silver.kamerstukdossier (id)
    columns:
      - name: id
        data_type: VARCHAR
        description: Uniek identificatienummer (GUID) van een Zaak.
        data_tests: [unique, not_null]
      - name: nummer
        data_type: VARCHAR
        description: Intern identificatienummer van een Zaak.
      - name: soort
        data_type: VARCHAR
        description: Soort Zaak.
      - name: onderwerp
        data_type: VARCHAR
        description: Onderwerp van een Zaak.
      - name: gestart_op
        data_type: DATE
        description: Begindatum van een Zaak.
      - name: organisatie
        data_type: VARCHAR
        description: Kamer van de Staten-Generaal die betrokken is bij een Zaak.
      - name: titel
        data_type: VARCHAR
        description: Titel van een Zaak.
      - name: citeertitel
        data_type: VARCHAR
        description: Citeertitel van een Zaak.
      - name: alias
        data_type: VARCHAR
        description: Alias van een Zaak.
      - name: grondslagvoorhang
        data_type: VARCHAR
        description: Grondslag voor de voorhangprocedure.
      - name: termijn
        data_type: TIMESTAMP
        description: Einddatum van de behandeling van een Zaak.
      - name: vergaderjaar
        data_type: VARCHAR
        description: Vergaderjaar waarin een Zaak wordt behandeld.
      - name: volgnummer
        data_type: INTEGER
        description: Uniek nummer van een Zaak binnen een Kamerstukdossier.
      - name: status
        data_type: VARCHAR
        description: Status van een Zaak.
      - name: afgedaan
        data_type: BOOLEAN
        description: Geeft aan of een Zaak is afgedaan.
      - name: groot_project
        data_type: BOOLEAN
        description: Geeft aan of een Zaak een groot project is.
      - name: kabinetsappreciatie
        data_type: VARCHAR
        description: Kabinetsappreciatie van een Zaak.
      - name: kamerstukdossier_id
        data_type: VARCHAR
        description: GUID van het bijbehorende Kamerstukdossier.
        data_tests:
          - relationships:
              arguments: {to: ref('kamerstukdossier'), field: id}
      - name: gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum in het bronsysteem.
        data_tests: [not_null]
      - name: api_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum zichtbaar in het Gegevensmagazijn.
        data_tests: [not_null]

  - name: zaak_actor
    description: >
      Actuele, ontdubbelde rollen van actoren binnen zaken. Verwijderde records
      worden niet opgenomen; niet-resolveerbare parent references worden NULL.
    constraints:
      - type: primary_key
        columns: [id]
      - type: foreign_key
        columns: [zaak_id]
        expression: silver.zaak (id)
      - type: foreign_key
        columns: [persoon_id]
        expression: silver.persoon (id)
      - type: foreign_key
        columns: [fractie_id]
        expression: silver.fractie (id)
      - type: foreign_key
        columns: [commissie_id]
        expression: silver.commissie (id)
    columns:
      - name: id
        data_type: VARCHAR
        description: Uniek identificatienummer (GUID) van een ZaakActor.
        data_tests: [unique, not_null]
      - name: zaak_id
        data_type: VARCHAR
        description: Uniek identificatienummer van de bijbehorende Zaak.
        data_tests:
          - relationships:
              arguments: {to: ref('zaak'), field: id}
      - name: persoon_id
        data_type: VARCHAR
        description: Uniek identificatienummer van de bijbehorende Persoon.
        data_tests:
          - relationships:
              arguments: {to: ref('persoon'), field: id}
      - name: fractie_id
        data_type: VARCHAR
        description: Uniek identificatienummer van de bijbehorende Fractie.
        data_tests:
          - relationships:
              arguments: {to: ref('fractie'), field: id}
      - name: commissie_id
        data_type: VARCHAR
        description: Uniek identificatienummer van de bijbehorende Commissie.
        data_tests:
          - relationships:
              arguments: {to: ref('commissie'), field: id}
      - name: actor_naam
        data_type: VARCHAR
        description: Naam van een ZaakActor ten tijde van de Zaak.
      - name: actor_fractie
        data_type: VARCHAR
        description: Fractie van een ZaakActor ten tijde van de Zaak.
      - name: actor_afkorting
        data_type: VARCHAR
        description: Afkorting van een ZaakActor ten tijde van de Zaak.
      - name: functie
        data_type: VARCHAR
        description: Functie van een ZaakActor ten tijde van de Zaak.
      - name: relatie
        data_type: VARCHAR
        description: Rol van een ZaakActor in de Zaak.
      - name: sid_actor
        data_type: VARCHAR
        description: Intern identificatienummer van een ZaakActor.
      - name: gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum in het bronsysteem.
        data_tests: [not_null]
      - name: api_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum zichtbaar in het Gegevensmagazijn.
        data_tests: [not_null]

  - name: zaak_activiteit
    description: Relatiebrug tussen Zaken en Activiteiten.
    constraints:
      - type: primary_key
        columns: [zaak_id, activiteit_id]
      - type: foreign_key
        columns: [zaak_id]
        expression: silver.zaak (id)
      - type: foreign_key
        columns: [activiteit_id]
        expression: silver.activiteit (id)
    columns:
      - name: zaak_id
        data_type: VARCHAR
        description: Zaak in de relatie.
      - name: activiteit_id
        data_type: VARCHAR
        description: Activiteit in de relatie.
      - name: relatie_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Wijzigingstijd van de bovenliggende Zaak-feedversie voor deze relatiesnapshot.

  - name: zaak_agendapunt
    description: Relatiebrug tussen Zaken en Agendapunten.
    constraints:
      - type: primary_key
        columns: [zaak_id, agendapunt_id]
      - type: foreign_key
        columns: [zaak_id]
        expression: silver.zaak (id)
      - type: foreign_key
        columns: [agendapunt_id]
        expression: silver.agendapunt (id)
    columns:
      - name: zaak_id
        data_type: VARCHAR
        description: Zaak in de relatie.
      - name: agendapunt_id
        data_type: VARCHAR
        description: Agendapunt in de relatie.
      - name: relatie_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Wijzigingstijd van de bovenliggende Zaak-feedversie voor deze relatiesnapshot.

  - name: toezegging
    description: >
      Actuele toezeggingen. Een activiteit_id zonder actieve overeenkomstige
      Activiteit wordt NULL gemaakt.
    constraints:
      - type: primary_key
        columns: [id]
      - type: foreign_key
        columns: [activiteit_id]
        expression: silver.activiteit (id)
    columns:
      - name: id
        data_type: VARCHAR
        description: Uniek identificatienummer van een Toezegging.
        data_tests: [unique, not_null]
      - name: aanmaakdatum
        data_type: DATE
        description: Datum waarop de toezegging is aangemaakt.
      - name: nummer
        data_type: VARCHAR
        description: Nummer van de toezegging.
      - name: activiteit_id
        data_type: VARCHAR
        description: GUID van de bijbehorende Activiteit, of NULL als die niet in silver staat.
        data_tests:
          - relationships:
              arguments: {to: ref('activiteit'), field: id}
      - name: activiteit_nummer
        data_type: VARCHAR
        description: Bronnummer van de bijbehorende Activiteit.
      - name: naam
        data_type: VARCHAR
        description: Naam van de toegezegde persoon zoals geregistreerd in de bron.
      - name: achternaam
        data_type: VARCHAR
        description: Achternaam van de toegezegde persoon.
      - name: initialen
        data_type: VARCHAR
        description: Initialen van de toegezegde persoon.
      - name: tussenvoegsel
        data_type: VARCHAR
        description: Tussenvoegsel van de toegezegde persoon.
      - name: voornaam
        data_type: VARCHAR
        description: Voornaam van de toegezegde persoon.
      - name: achtervoegsel
        data_type: VARCHAR
        description: Achtervoegsel van de toegezegde persoon.
      - name: titulatuur
        data_type: VARCHAR
        description: Titulatuur van de toegezegde persoon.
      - name: functie
        data_type: VARCHAR
        description: Functie van de persoon die de toezegging deed.
      - name: status
        data_type: VARCHAR
        description: Status van de toezegging.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Openstaand", "Voldaan", "Deels Voldaan", "Vervallen", "Afgedaan", "Deels Afgedaan"]
      - name: datum_nakoming
        data_type: DATE
        description: Datum waarop de toezegging is nagekomen.
      - name: ministerie
        data_type: VARCHAR
        description: Ministerie dat verantwoordelijk is voor de toezegging.
      - name: tekst
        data_type: VARCHAR
        description: Inhoudelijke tekst van de toezegging.
      - name: gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum in het bronsysteem.
        data_tests: [not_null]
      - name: api_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum zichtbaar in het Gegevensmagazijn.
        data_tests: [not_null]

  - name: toezegging_is_aanvulling_op
    description: Zelfrefererende brug voor toezeggingen die een aanvulling zijn op andere toezeggingen.
    constraints:
      - type: primary_key
        columns: [toezegging_id, aanvulling_op_id]
      - type: foreign_key
        columns: [toezegging_id]
        expression: silver.toezegging (id)
      - type: foreign_key
        columns: [aanvulling_op_id]
        expression: silver.toezegging (id)
    columns:
      - name: toezegging_id
        data_type: VARCHAR
        description: Toezegging die de aanvulling vormt.
      - name: aanvulling_op_id
        data_type: VARCHAR
        description: Toezegging waarop wordt aangevuld.
      - name: relatie_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum van deze relatie in de bron.

  - name: toezegging_is_herhaling_van
    description: Zelfrefererende brug voor toezeggingen die een herhaling van eerdere toezeggingen zijn.
    constraints:
      - type: primary_key
        columns: [toezegging_id, herhaling_van_id]
      - type: foreign_key
        columns: [toezegging_id]
        expression: silver.toezegging (id)
      - type: foreign_key
        columns: [herhaling_van_id]
        expression: silver.toezegging (id)
    columns:
      - name: toezegging_id
        data_type: VARCHAR
        description: Toezegging die de herhaling vormt.
      - name: herhaling_van_id
        data_type: VARCHAR
        description: Eerdere toezegging die wordt herhaald.
      - name: relatie_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum van deze relatie in de bron.

  - name: toezegging_is_wijziging_van
    description: Zelfrefererende brug voor toezeggingen die eerdere toezeggingen wijzigen.
    constraints:
      - type: primary_key
        columns: [toezegging_id, wijziging_van_id]
      - type: foreign_key
        columns: [toezegging_id]
        expression: silver.toezegging (id)
      - type: foreign_key
        columns: [wijziging_van_id]
        expression: silver.toezegging (id)
    columns:
      - name: toezegging_id
        data_type: VARCHAR
        description: Toezegging die de wijziging vormt.
      - name: wijziging_van_id
        data_type: VARCHAR
        description: Eerdere toezegging die wordt gewijzigd.
      - name: relatie_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum van deze relatie in de bron.

  - name: toezegging_kamerbrief_nakoming
    description: Brug tussen toezeggingen en Kamerbrieven waarmee zij worden nagekomen.
    constraints:
      - type: primary_key
        columns: [toezegging_id, document_id]
      - type: foreign_key
        columns: [toezegging_id]
        expression: silver.toezegging (id)
      - type: foreign_key
        columns: [document_id]
        expression: silver.document (id)
    columns:
      - name: toezegging_id
        data_type: VARCHAR
        description: Toezegging die wordt nagekomen.
      - name: document_id
        data_type: VARCHAR
        description: Document van de Kamerbrief waarmee de toezegging wordt nagekomen.
      - name: relatie_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Wijzigingstijd van de bovenliggende Toezegging-feedversie voor deze relatiesnapshot.

  - name: toezegging_toegezegd_aan
    description: Brug met de personen en fracties aan wie een toezegging is gedaan.
    constraints:
      - type: primary_key
        columns: [toezegging_id, volgorde]
      - type: foreign_key
        columns: [toezegging_id]
        expression: silver.toezegging (id)
      - type: foreign_key
        columns: [persoon_id]
        expression: silver.persoon (id)
      - type: foreign_key
        columns: [fractie_id]
        expression: silver.fractie (id)
    columns:
      - name: toezegging_id
        data_type: VARCHAR
        description: Toezegging die aan actoren is gedaan.
      - name: volgorde
        data_type: INTEGER
        description: Positie van de actorverwijzing in de bronlijst.
      - name: persoon_id
        data_type: VARCHAR
        description: Optionele GUID van de Persoon aan wie is toegezegd.
        data_tests:
          - relationships:
              arguments: {to: ref('persoon'), field: id}
      - name: fractie_id
        data_type: VARCHAR
        description: Optionele GUID van de Fractie aan wie is toegezegd.
        data_tests:
          - relationships:
              arguments: {to: ref('fractie'), field: id}
      - name: relatie_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Wijzigingstijd van de bovenliggende Toezegging-feedversie voor deze relatiesnapshot.

  - name: zaak_gerelateerd_vanuit
    description: Zelfrefererende relatiebrug voor gerelateerde Zaken.
    constraints:
      - type: primary_key
        columns: [zaak_id, gerelateerd_vanuit_id]
      - type: foreign_key
        columns: [zaak_id]
        expression: silver.zaak (id)
      - type: foreign_key
        columns: [gerelateerd_vanuit_id]
        expression: silver.zaak (id)
    columns:
      - name: zaak_id
        data_type: VARCHAR
        description: Zaak in de relatie.
      - name: gerelateerd_vanuit_id
        data_type: VARCHAR
        description: Gerelateerde bronzaak.
      - name: relatie_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Wijzigingstijd van de bovenliggende Zaak-feedversie voor deze relatiesnapshot.

  - name: zaak_vervangen_vanuit
    description: Zelfrefererende relatiebrug voor vervangen Zaken.
    constraints:
      - type: primary_key
        columns: [zaak_id, vervangen_vanuit_id]
      - type: foreign_key
        columns: [zaak_id]
        expression: silver.zaak (id)
      - type: foreign_key
        columns: [vervangen_vanuit_id]
        expression: silver.zaak (id)
    columns:
      - name: zaak_id
        data_type: VARCHAR
        description: Zaak in de relatie.
      - name: vervangen_vanuit_id
        data_type: VARCHAR
        description: Vervangen bronzaak.
      - name: relatie_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Wijzigingstijd van de bovenliggende Zaak-feedversie voor deze relatiesnapshot.

  - name: activiteit_actor
    description: >
      Actuele, ontdubbelde rollen van actoren binnen activiteiten. Verwijderde
      records worden niet opgenomen; niet-resolveerbare parent references worden NULL.
    constraints:
      - type: primary_key
        columns: [id]
      - type: foreign_key
        columns: [activiteit_id]
        expression: silver.activiteit (id)
      - type: foreign_key
        columns: [commissie_id]
        expression: silver.commissie (id)
      - type: foreign_key
        columns: [persoon_id]
        expression: silver.persoon (id)
      - type: foreign_key
        columns: [fractie_id]
        expression: silver.fractie (id)
    columns:
      - name: id
        data_type: VARCHAR
        description: Uniek identificatienummer (GUID) van een ActiviteitActor.
        data_tests: [unique, not_null]
      - name: activiteit_id
        data_type: VARCHAR
        description: Uniek identificatienummer van de bijbehorende Activiteit.
        data_tests:
          - relationships:
              arguments: {to: ref('activiteit'), field: id}
      - name: commissie_id
        data_type: VARCHAR
        description: Uniek identificatienummer van de bijbehorende Commissie.
        data_tests:
          - relationships:
              arguments: {to: ref('commissie'), field: id}
      - name: persoon_id
        data_type: VARCHAR
        description: Uniek identificatienummer van de bijbehorende Persoon.
        data_tests:
          - relationships:
              arguments: {to: ref('persoon'), field: id}
      - name: fractie_id
        data_type: VARCHAR
        description: Uniek identificatienummer van de bijbehorende Fractie.
        data_tests:
          - relationships:
              arguments: {to: ref('fractie'), field: id}
      - name: actor_naam
        data_type: VARCHAR
        description: Naam van een ActiviteitActor ten tijde van de Activiteit.
      - name: actor_fractie
        data_type: VARCHAR
        description: Fractie van een ActiviteitActor ten tijde van de Activiteit.
      - name: relatie
        data_type: VARCHAR
        description: Relatie van de ActiviteitActor met de Activiteit.
      - name: volgorde
        data_type: INTEGER
        description: Positie van een ActiviteitActor op de sprekerslijst.
      - name: functie
        data_type: VARCHAR
        description: Functie van een ActiviteitActor ten tijde van de Activiteit.
      - name: spreektijd
        data_type: VARCHAR
        description: Spreektijd die een ActiviteitActor heeft bij de Activiteit.
      - name: sid_actor
        data_type: VARCHAR
        description: Intern identificatienummer van een ActiviteitActor.
      - name: gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum in het bronsysteem.
        data_tests: [not_null]
      - name: api_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum zichtbaar in het Gegevensmagazijn.
        data_tests: [not_null]

  - name: agendapunt
    description: >
      Actuele, ontdubbelde geregistreerde onderwerpen. Verwijderde agendapunten
      worden niet opgenomen; activiteit_id wordt NULL als de Activiteit niet in silver staat.
    constraints:
      - type: primary_key
        columns: [id]
      - type: foreign_key
        columns: [activiteit_id]
        expression: silver.activiteit (id)
    columns:
      - name: id
        data_type: VARCHAR
        description: Uniek identificatienummer (GUID) van een Agendapunt.
        data_tests: [unique, not_null]
      - name: activiteit_id
        data_type: VARCHAR
        description: Uniek identificatienummer van de bijbehorende Activiteit.
        data_tests:
          - relationships:
              arguments: {to: ref('activiteit'), field: id}
      - name: nummer
        data_type: VARCHAR
        description: Intern identificatienummer van een Agendapunt.
      - name: onderwerp
        data_type: VARCHAR
        description: Onderwerp van een Agendapunt.
      - name: aanvangstijd
        data_type: TIMESTAMP
        description: Begintijd van een Agendapunt.
      - name: eindtijd
        data_type: TIMESTAMP
        description: Eindtijd van een Agendapunt.
      - name: volgorde
        data_type: INTEGER
        description: Positie van een Agendapunt op de agenda.
      - name: rubriek
        data_type: VARCHAR
        description: Rubriek waartoe een Agendapunt behoort.
      - name: noot
        data_type: VARCHAR
        description: Notitie bij een Agendapunt.
      - name: status
        data_type: VARCHAR
        description: Status van een Agendapunt.
      - name: gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum in het bronsysteem.
        data_tests: [not_null]
      - name: api_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum zichtbaar in het Gegevensmagazijn.
        data_tests: [not_null]

  - name: kamerstukdossier
    description: >
      Actuele, ontdubbelde dossiers met documenten over een specifiek onderwerp.
      Verwijderde dossiers worden niet opgenomen.
    constraints:
      - type: primary_key
        columns: [id]
    columns:
      - name: id
        data_type: VARCHAR
        description: Uniek identificatienummer (GUID) van een Kamerstukdossier.
        data_tests: [unique, not_null]
      - name: titel
        data_type: VARCHAR
        description: Titel van een Kamerstukdossier.
      - name: citeertitel
        data_type: VARCHAR
        description: Citeertitel van een Kamerstukdossier.
      - name: alias
        data_type: VARCHAR
        description: Alias van een Kamerstukdossier.
      - name: nummer
        data_type: INTEGER
        description: Intern identificatienummer van een Kamerstukdossier.
      - name: toevoeging
        data_type: VARCHAR
        description: Begrotingshoofdstukvermelding bij een Kamerstukdossier.
      - name: hoogste_volgnummer
        data_type: INTEGER
        description: Aantal documenten in een Kamerstukdossier.
      - name: afgesloten
        data_type: BOOLEAN
        description: Geeft aan of een Kamerstukdossier is afgesloten.
      - name: kamer
        data_type: VARCHAR
        description: Kamer van de Staten-Generaal die betrokken is bij een Kamerstukdossier.
      - name: gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum in het bronsysteem.
        data_tests: [not_null]
      - name: api_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: Laatste wijzigingsdatum zichtbaar in het Gegevensmagazijn.
        data_tests: [not_null]

  - name: activiteit
    description: >
      Actuele, ontdubbelde activiteiten als onderdeel van het parlementaire
      proces. Verwijderde activiteiten worden niet opgenomen; een niet-resolveerbare
      voortouwcommissie_id wordt NULL gemaakt.
    constraints:
      - type: primary_key
        columns: [id]
      - type: foreign_key
        columns: [voortouwcommissie_id]
        expression: silver.commissie (id)
    columns:
      - name: id
        data_type: VARCHAR
        description: Uniek identificatienummer (GUID) van een Activiteit.
        data_tests: [unique, not_null]
      - name: soort
        data_type: VARCHAR
        description: Soort Activiteit.
      - name: nummer
        data_type: VARCHAR
        description: Intern identificatienummer van een Activiteit.
      - name: onderwerp
        data_type: VARCHAR
        description: Onderwerp van een Activiteit.
      - name: datum_soort
        data_type: VARCHAR
        description: Context voor de datum van een Activiteit.
      - name: datum
        data_type: DATE
        description: Datum waarop een Activiteit plaatsvindt.
      - name: aanvangstijd
        data_type: TIMESTAMP
        description: Tijd waarop een Activiteit begint.
      - name: eindtijd
        data_type: TIMESTAMP
        description: Tijd waarop een Activiteit eindigt.
      - name: locatie
        data_type: VARCHAR
